# Every push to main makes a printable cheat sheet of each mission's
# starting position (the R.A.P. comments), in menu order.
#
# Where to find it:
#   - With GitHub Pages turned on (repo Settings > Pages > Source:
#     "GitHub Actions"), it is always at
#     https://<owner>.github.io/<repo>/
#   - Either way, it is on the repo's "Actions" tab: click the newest
#     run, then download cheat_sheet.html from "Artifacts" at the bottom.
name: Cheat sheet

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Two quick pushes in a row: only the newest sheet gets published.
concurrency:
  group: cheat-sheet
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outputs.on }}
    steps:
      - uses: actions/checkout@v7
      - run: python3 .github/cheat_sheet.py
      - uses: actions/upload-artifact@v7
        with:
          path: cheat_sheet.html
          # Upload the page itself, not a zip, so it opens right in a browser.
          archive: false

      # Is GitHub Pages turned on for this repo? If not, that is fine: the
      # publish job below is skipped and the run stays green.
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || true)
          if [ "$source" = "workflow" ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
            mkdir _site && cp cheat_sheet.html _site/index.html
          else
            echo "::notice::No permanent link yet. To get one, a repo admin sets Settings > Pages > Source to GitHub Actions."
          fi
      - if: steps.pages.outputs.on == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  publish:
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
